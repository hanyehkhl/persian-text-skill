name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run tests
        run: uv run --no-project --python ${{ matrix.python-version }} --with pytest python -m pytest -q

  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate SKILL.md against the agentskills.io spec
        run: >
          uvx --from "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref"
          skills-ref validate skills/persian-text-skill
